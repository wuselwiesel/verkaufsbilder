name: Veröffentlichen

# Stellt die Seite auf GitHub Pages bereit, sobald auf main etwas geändert wird.
# Lässt sich auch von Hand starten (Reiter Actions → Run workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Nur die Seiten-Dateien bereitstellen
        run: |
          mkdir site
          cp index.html style.css core.js render.js ui.js sw.js manifest.webmanifest icon.svg icon-192.png icon-512.png site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
